<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Margaritas</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- ================= LOGIN ================= -->
    <div class="pantalla-login" id="pantalla-login">
        <div class="tarjeta-login">
            <h1 class="marca">Margaritas<span>.</span></h1>
            <p class="sub">Panel de control</p>

            <div class="campo">
                <label for="username">Usuario</label>
                <input type="text" id="username" autocomplete="username" placeholder="Ingresar usuario">
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="Ingresar contraseña">
            </div>
            <button class="btn btn--ancho" id="login-btn">Iniciar sesión</button>
            <p class="error" id="login-err"></p>
        </div>
    </div>

    <!--
        ================= PANEL =================
        Para sumar una sección nueva alcanza con:
          1. un <button class="nav-item" data-seccion="X"> en el menú lateral
          2. una <section class="seccion" id="seccion-X"> acá abajo
        La navegación entre secciones ya la resuelve admin.js.
    -->
    <div class="app" id="app">
        <aside class="lateral">
            <h1 class="marca">Margaritas<span>.</span></h1>
            <button class="nav-item activo" data-seccion="whatsapp"><span class="ico">💬</span> WhatsApp</button>
            <button class="nav-item" data-seccion="productos"><span class="ico">💐</span> Productos</button>
            <div class="lateral-pie">
                <button class="btn btn--peligro btn--ancho" id="logout-btn">Cerrar sesión</button>
            </div>
        </aside>

        <main class="contenido">

            <!-- ---------- WhatsApp ---------- -->
            <section class="seccion activa" id="seccion-whatsapp">
                <h2 class="titulo-seccion">Bot de WhatsApp</h2>
                <p class="bajada">Estado de la línea que recibe los pedidos de la tienda.</p>

                <div class="tarjeta">
                    <div class="estado esperando" id="bot-status">Consultando…</div>

                    <div class="qr-caja" id="qr-wrapper">
                        <p class="bajada" style="margin:14px 0 10px;">Escaneá este código con el WhatsApp del local para vincular el bot de ventas.</p>
                        <img id="qr-img" src="" alt="Código QR de vinculación">
                    </div>

                    <div class="acciones">
                        <button class="btn btn--fantasma" id="disconnect-btn" style="display:none;">Desconectar y escanear nuevo QR</button>
                    </div>
                </div>
            </section>

        
            <!-- ---------- Productos ---------- -->
            <section class="seccion" id="seccion-productos">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <div>
                        <h2 class="titulo-seccion">Catálogo</h2>
                        <p class="bajada">Administrar ramos, precios y fotos.</p>
                    </div>
                    <button class="btn" id="btn-nuevo-prod">+ Nuevo Producto</button>
                </div>

                <!-- Formulario Modal Nuevo/Editar -->
                <div class="tarjeta" id="form-producto" style="display:none; margin-bottom:30px;">
                    <h3 style="margin-bottom:15px; font-size:1.1rem" id="form-prod-titulo">Agregar Producto</h3>
                    <input type="hidden" id="prod-id">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:15px;">
                        <div class="campo">
                            <label>Nombre del Ramo</label>
                            <input type="text" id="prod-title" placeholder="Ej: Rosas Rojas">
                        </div>
                        <div class="campo">
                            <label>Precio (Gs)</label>
                            <input type="number" id="prod-price" placeholder="Ej: 150000">
                        </div>
                        <div class="campo">
                            <label>Temporada (tag)</label>
                            <select id="prod-tag" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ddd;">
                                <option value="Primavera">Primavera</option>
                                <option value="Verano">Verano</option>
                                <option value="Otoño">Otoño</option>
                                <option value="Invierno">Invierno</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label>Foto (Opcional si edita)</label>
                            <input type="file" id="prod-img" accept="image/*" style="font-size:0.9rem">
                        </div>
                    </div>
                    <div class="campo" style="margin-bottom:20px;">
                        <label>Descripción</label>
                        <input type="text" id="prod-desc" placeholder="Breve descripción del producto">
                    </div>
                    <div style="display:flex; gap:10px; justify-content:flex-end">
                        <button class="btn btn--fantasma" id="btn-cancelar-prod">Cancelar</button>
                        <button class="btn" id="btn-guardar-prod">Guardar</button>
                    </div>
                </div>

                <!-- Grilla de productos -->
                <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;" id="grid-admin-productos">
                    <!-- Dinámico -->
                </div>
            </section>

        </main>
    </div>

    <div class="avisos" id="avisos"></div>

    <script src="admin.js"></script>
</body>
</html>
